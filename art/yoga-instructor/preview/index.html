<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Instructor Master Review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#F5F3EE;--card:#fff;--ink:#171C28;--muted:#5E6472}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 20px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
figure{margin:0;background:var(--card);border-radius:20px;padding:12px}
figcaption{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}
.tall img{height:640px}.wide img{width:min(1100px,100%)}
</style></head><body>
<h1>YogaSenseAI instructor — master character (v1)</h1>
<p>One character, drawn once. Poses change joint angles only. The rig check is a test pose, not an asana.</p>
<div class="row tall">
<figure><img src="../instructor_front_rig.svg" alt="Front master"><figcaption>Front master (A-pose)</figcaption></figure>
<figure><img src="../instructor_side_rig.svg" alt="Side master"><figcaption>Side master (for Chair Pose)</figcaption></figure>
<figure><img src="rig_check.svg" alt="Rig check"><figcaption>Rig check: same parts, angles only</figcaption></figure>
</div>
<div class="row wide" style="margin-top:20px">
<figure><img src="../parts_sheet.svg" alt="Parts sheet"><figcaption>Separated parts — coral = pivot, lime = child attachment</figcaption></figure>
</div>
</body></html>
